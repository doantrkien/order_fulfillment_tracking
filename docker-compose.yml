version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_tracking
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DB_HOST: postgres
    volumes:
      - .:/app
      - /app/tmp               
    depends_on:
      postgres:
        condition: service_healthy 
    stdin_open: true
    tty: true            

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_DB: ${DB_DATABASE:-order_tracking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-order_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
