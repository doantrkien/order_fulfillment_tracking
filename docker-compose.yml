services:
  db:
    image: postgres:15-alpine
    container_name: order_fulfillment_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "8086:8080"
    depends_on:
      - db

volumes:
  pg_data:
