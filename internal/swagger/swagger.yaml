      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Success

                  data:
                    type: object

                    properties:
                      customer_name:
                        type: string
                        example: Supper Man

                      customer_phone:
                        type: string
                        example: 19008199

                      shipping_addr:
                        type: string
                        example: "Viet Nam"

                      status:
                        type: string
                        example: Paid
        
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 400
       
                  message:
                    type: string
                    example: "Dữ liệu đầu vào không hợp lệ.!"

                  data:
                    type: object
                    nullable: true 

        "401":
          description: UnAuthentication
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 401

                  message:
                    type: string
                    example: "Vui lòng đăng nhập để thực hiện thao tác.!"

                  data:
                    type: object
                    nullable: true

        "403":
          description: UnAuthorization
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 403
       
                  message:
                    type: string
                    example: "Bạn không có quyền thao tác.!"

                  data:
                    type: object
                    nullable: true

        "404":
          description: Data not found
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 404
       
                  message:
                    type: string
                    example: "Không tìm thấy dữ liệu theo yêu cầu của bạn.!"

                  data:
                    type: object
                    nullable: true                  

  /api/v1/orders/{id}/status:
    patch:
      summary: Update order status
      tags:
        - Order

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

        - name: status
          in: query
          required: true

          schema:
            type: string
            example: DELIVERED

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Success

                  data:
                    type: object
                    nullable: true

        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 400
       
                  message:
                    type: string
                    example: "Dữ liệu đầu vào không hợp lệ.!"

                  data:
                    type: object
                    nullable: true 

        "401":
          description: UnAuthentication
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 401

                  message:
                    type: string
                    example: "Vui lòng đăng nhập để thực hiện thao tác.!"

                  data:
                    type: object
                    nullable: true

        "403":
          description: UnAuthorization
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 403
       
                  message:
                    type: string
                    example: "Bạn không có quyền thao tác.!"

                  data:
                    type: object
                    nullable: true

  /api/v1/order-events/import:
    post:
      summary: Import batch order events
      description: >
        Process a batch of order status update events concurrently.
        Each event is validated and processed in its own DB transaction.
        The response always returns aggregated counts, even on partial failure.
      tags:
        - Order Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - order_id
                  - status
                  - event_at
                  - updated_by
                properties:
                  order_id:
                    type: integer
                    format: int64
                    example: 100156
                  status:
                    type: string
                    enum: [created, paid, packed, shipped, delivered, cancelled, refunded]
                    example: packed
                  event_at:
                    type: string
                    format: date-time
                    example: "2026-05-17T09:00:00Z"
                  updated_by:
                    type: string
                    example: warehouse_staff_01
            example:
              - order_id: 100156
                status: packed
                event_at: "2026-05-17T09:00:00Z"
                updated_by: warehouse_staff_01
              - order_id: 100157
                status: shipped
                event_at: "2026-05-17T09:15:00Z"
                updated_by: driver_nguyen_van_a

      responses:
        "200":
          description: Batch processed successfully (may include rejected/duplicate events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: batch processed
                  data:
                    type: object
                    properties:
                      accepted_count:
                        type: integer
                        example: 8
                      rejected_count:
                        type: integer
                        example: 1
                      duplicate_count:
                        type: integer
                        example: 1
                      errors:
                        type: array
                        description: Details for rejected and duplicate events
                        items:
                          type: object
                          properties:
                            order_id:
                              type: integer
                              format: int64
                              example: 100157
                            status:
                              type: string
                              example: delivered
                            reason:
                              type: string
                              example: "Invalid transition from 'created' to 'delivered'"

        "400":
          description: Invalid payload (malformed JSON or wrong type)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: invalid payload
                  data:
                    type: object
                    nullable: true

        "500":
          description: Internal error (partial results may be returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "db connection error"
                  data:
                    type: object
                    nullable: true
                    properties:
                      accepted_count:
                        type: integer
                        example: 2
                      rejected_count:
                        type: integer
                        example: 1
                      duplicate_count:
                        type: integer
                        example: 1
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            order_id:
                              type: integer
                              format: int64
                            status:
                              type: string
                            reason:
                              type: string

  /api/v1/reports/daily:
    get:
      summary: Daily order report
      tags:
        - Report
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Success

                  data:
                    type: array

                    items:
                      type: object

                      properties:
                        date:
                          type: string
                          example: 2026-05-13

                        total_orders:
                          type: integer
                          example: 120

                        total_created:
                          type: integer
                          example: 100

                        total_delivered:
                          type: integer
                          example: 100

                        total_canceled:
                          type: integer
                          example: 20
                        
                        total_refunded:
                          type: integer
                          example: 10
                        
                        total_income:
                          type: float
                          example: 199.99

        "401":
          description: UnAuthentication
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 401

                  message:
                    type: string
                    example: "Vui lòng đăng nhập để thực hiện thao tác.!"

                  data:
                    type: object
                    nullable: true

        "403":
          description: UnAuthorization
          content:
            application/json:
              schema:
                type: object

                properties:
                  status:
                    type: integer
                    example: 403
       
                  message:
                    type: string
                    example: "Bạn không có quyền thao tác.!"

                  data:
                    type: object
                    nullable: true