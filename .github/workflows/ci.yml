name: Go CI

on:
  push:
    branches: ["dev" ,"main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.26.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: make test-all

      - name: Verify all packages compile
        run: go build ./...
      
      - name: Build server binary
        run: |
          mkdir -p bin
          go build -o bin/server ./cmd/api