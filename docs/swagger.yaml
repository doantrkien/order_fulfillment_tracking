basePath: /
definitions:
  dto.AnalyzeExceptionRequest:
    properties:
      note:
        example: Phân tích đơn hàng này hộ tôi
        maxLength: 500
        type: string
    type: object
  dto.AnalyzeExceptionResponse:
    properties:
      confidence_score:
        type: number
      evaluated_at:
        type: string
      exception_type:
        type: string
      fallback_used:
        type: boolean
      internal_next_action:
        type: string
      likely_reason:
        type: string
      order_id:
        type: string
      prompt_template_version:
        type: string
      result_id:
        type: string
      severity:
        type: string
    type: object
  dto.CreateOrderResponse:
    properties:
      created_at:
        example: "2026-05-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      shipping_address:
        example: 123 Nguyen Hue
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.OrderStatus'
        example: created
      total_amount:
        example: 250000
        type: integer
      updated_at:
        example: "2026-05-01T00:00:00Z"
        type: string
    type: object
  dto.DailyReportResponse:
    properties:
      avg_deliver_time:
        example: 2.5
        type: number
      date:
        example: "2026-05-13T00:00:00Z"
        type: string
      total_canceled:
        example: 20
        type: integer
      total_created:
        example: 100
        type: integer
      total_delivered:
        example: 100
        type: integer
      total_income:
        example: 199.99
        type: number
      total_orders:
        example: 120
        type: integer
      total_refunded:
        example: 10
        type: integer
    type: object
  dto.EventError:
    properties:
      order_id:
        example: 100157
        type: integer
      reason:
        example: Invalid transition from 'created' to 'delivered'
        type: string
      status:
        example: delivered
        type: string
    type: object
  dto.GenerateDraftAPIRequest:
    properties:
      channel:
        example: email
        type: string
      order_id:
        example: 12345
        type: integer
      tone:
        example: apologetic
        type: string
    type: object
  dto.GenerateDraftAPIResponse:
    properties:
      confidence_score:
        type: number
      draft_message:
        type: string
      fallback_used:
        type: boolean
      generated_at:
        type: string
      order_id:
        type: integer
      prompt_template_version:
        type: string
      tone:
        type: string
    type: object
  dto.GetDailyReportRequest:
    properties:
      date:
        example: "2026-05-18"
        type: string
    required:
    - date
    type: object
  dto.ImportOrderEventRequest:
    properties:
      driver_id:
        example: 1
        type: integer
      driver_note:
        example: Left at door
        type: string
      event_at:
        example: "2026-05-17T09:00:00Z"
        type: string
      order_id:
        example: 100156
        type: integer
      status:
        example: packed
        type: string
      updated_by:
        example: admin
        type: string
    type: object
  dto.ImportOrderEventsResponse:
    properties:
      accepted_count:
        example: 8
        type: integer
      duplicate_count:
        example: 1
        type: integer
      errors:
        items:
          $ref: '#/definitions/dto.EventError'
        type: array
      rejected_count:
        example: 1
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: admin@order.com
        type: string
      password:
        example: "12345"
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      role:
        type: string
      token_type:
        type: string
    type: object
  dto.OrderReponse:
    properties:
      id:
        example: 1
        type: integer
      ordered_at:
        example: "2026-05-01T00:00:00Z"
        type: string
      shipping_address:
        example: 123 Nguyen Hue
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.OrderStatus'
        example: paid
      total_amount:
        example: 100000
        type: integer
      user_phone:
        example: "0977605602"
        type: string
      username:
        example: Nguyen Tien Khoa
        type: string
    type: object
  dto.OrderRequest:
    properties:
      shipping_address:
        example: Viet Nam
        type: string
      total_amount:
        example: 100000
        type: integer
      user_phone:
        example: "10123456789"
        type: string
      username:
        example: Supper Man
        type: string
    required:
    - shipping_address
    - total_amount
    - user_phone
    - username
    type: object
  dto.TriggerEvaluationRequest:
    properties:
      dataset_name:
        type: string
    required:
    - dataset_name
    type: object
  dto.TriggerEvaluationResponse:
    properties:
      message:
        type: string
      run_id:
        type: integer
      status:
        type: string
    type: object
  dto.UpdateStatusRequest:
    properties:
      driver_id:
        example: 42
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/models.OrderStatus'
        example: delivered
    required:
    - status
    type: object
  models.OrderStatus:
    enum:
    - created
    - paid
    - packed
    - shipped
    - delivered
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - ORDER_STATUS_CREATED
    - ORDER_STATUS_PAID
    - ORDER_STATUS_PACKED
    - ORDER_STATUS_SHIPPED
    - ORDER_STATUS_DELIVERED
    - ORDER_STATUS_CANCELLED
    - ORDER_STATUS_REFUNDED
  response.CreateOrderSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.CreateOrderResponse'
      message:
        example: Success
        type: string
      status:
        example: 201
        type: integer
    type: object
  response.ErrorBadReqResponse:
    properties:
      data: {}
      message:
        example: Invalid input data
        type: string
      status:
        example: 400
        type: integer
    type: object
  response.ErrorInternalServerErrorResponse:
    properties:
      data: {}
      message:
        example: Internal server error
        type: string
      status:
        example: 500
        type: integer
    type: object
  response.ErrorNotFoundResponse:
    properties:
      data: {}
      message:
        example: Resource not found
        type: string
      status:
        example: 404
        type: integer
    type: object
  response.ErrorUnauthenticatedResponse:
    properties:
      data: {}
      message:
        example: Authentication required
        type: string
      status:
        example: 401
        type: integer
    type: object
  response.ErrorUnauthorizedResponse:
    properties:
      data: {}
      message:
        example: Permission denied
        type: string
      status:
        example: 403
        type: integer
    type: object
  response.PaginatedResponse:
    properties:
      data: {}
      message:
        example: Success
        type: string
      pagination:
        $ref: '#/definitions/response.Pagination'
      status:
        example: SUCCESS
        type: string
    type: object
  response.Pagination:
    properties:
      current_page:
        example: 1
        type: integer
      limit_items:
        example: 10
        type: integer
      total_items:
        example: 100
        type: integer
    type: object
  response.ResponseStruct:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
host: localhost:5000
info:
  contact: {}
  description: HTTP API for order fulfillment tracking.
  title: Order Fulfillment Tracking API
  version: 1.0.0
paths:
  /api/v1/ai/evaluations/order-exceptions:
    post:
      consumes:
      - application/json
      description: Start an asynchronous batch evaluation of the AI rules against
        synthetic ground truth data.
      parameters:
      - description: Dataset name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TriggerEvaluationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.TriggerEvaluationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Trigger AI batch evaluation
      tags:
      - AI Evaluation
  /api/v1/ai/orders/{id}/exception-analysis:
    post:
      consumes:
      - application/json
      description: Analyze order exceptions and provide actionable insights. Uses
        rule-based fallback if AI is unavailable.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional analysis context notes
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.AnalyzeExceptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.AnalyzeExceptionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorUnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Analyze order exception using AI
      tags:
      - AI
  /api/v1/ai/orders/{id}/insights/latest:
    get:
      description: Retrieve the most recent AI-generated exception insights for a
        specific order, including customer update draft.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.AnalyzeExceptionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get latest AI exception analysis for an order
      tags:
      - AI
  /api/v1/ai/orders/customer-update-draft:
    post:
      consumes:
      - application/json
      description: Generate draft message for order exception using AI.
      parameters:
      - description: Generate draft message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GenerateDraftAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.GenerateDraftAPIResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate draft message using AI
      tags:
      - AI
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password to receive a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
      summary: Login to get access token
      tags:
      - Auth
  /api/v1/order-events/import:
    post:
      consumes:
      - application/json
      description: Process a batch of order status update events concurrently. Each
        event is validated and processed in its own DB transaction. The response always
        returns aggregated counts, even on partial failure.
      parameters:
      - description: List of events
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/dto.ImportOrderEventRequest'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.ImportOrderEventsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ImportOrderEventsResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Import batch order events
      tags:
      - Order Event
  /api/v1/orders:
    get:
      consumes:
      - application/json
      parameters:
      - description: Order Status
        in: query
        name: status
        type: string
      - description: Customer Name
        in: query
        name: customer_name
        type: string
      - description: Ordered Date
        in: query
        name: ordered_at
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.OrderReponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: Create a new order
      parameters:
      - description: Order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.CreateOrderSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Create order
      tags:
      - Order
  /api/v1/orders/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve detail of an order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderReponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorUnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get order detail
      tags:
      - Order
  /api/v1/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Update the status of an order. Drivers can only set "shipped" or "delivered".
        The driver_id field is optional and only used by admins to assign a driver.
        When a driver calls this API, driver_id is automatically set from their token.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status and optional driver_id (admin only)
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorUnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - Order
  /api/v1/reports/daily:
    get:
      consumes:
      - application/json
      parameters:
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.DailyReportResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorUnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Daily order report
      tags:
      - Report
    post:
      consumes:
      - application/json
      parameters:
      - description: Date request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GetDailyReportRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.DailyReportResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBadReqResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorUnauthenticatedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorInternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Create daily report manually
      tags:
      - Report
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
