basePath: /
definitions:
  dto.DailyReportResponse:
    properties:
      avg_deliver_time:
        example: 2.5
        type: number
      date:
        example: "2026-05-13T00:00:00Z"
        type: string
      total_canceled:
        example: 20
        type: integer
      total_created:
        example: 100
        type: integer
      total_delivered:
        example: 100
        type: integer
      total_income:
        example: 199.99
        type: number
      total_orders:
        example: 120
        type: integer
      total_refunded:
        example: 10
        type: integer
    type: object
  dto.EventError:
    properties:
      order_id:
        example: 100157
        type: integer
      reason:
        example: Invalid transition from 'created' to 'delivered'
        type: string
      status:
        example: delivered
        type: string
    type: object
  dto.GetDailyReportRequest:
    properties:
      date:
        example: "2026-05-18"
        type: string
    required:
    - date
    type: object
  dto.ImportOrderEventRequest:
    properties:
      event_at:
        example: "2026-05-17T09:00:00Z"
        type: string
      order_id:
        example: 100156
        type: integer
      status:
        example: packed
        type: string
      updated_by:
        example: warehouse_staff_01
        type: string
    type: object
  dto.ImportOrderEventsResponse:
    properties:
      accepted_count:
        example: 8
        type: integer
      duplicate_count:
        example: 1
        type: integer
      errors:
        items:
          $ref: '#/definitions/dto.EventError'
        type: array
      rejected_count:
        example: 1
        type: integer
    type: object
  dto.OrderReponse:
    properties:
      id:
        example: 1
        type: integer
      ordered_at:
        example: "2026-05-01T00:00:00Z"
        type: string
      shipping_address:
        example: Viet Nam
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.OrderStatus'
        example: paid
      total_amount:
        example: 100000
        type: integer
      user_phone:
        example: "0123456789"
        type: string
      username:
        example: Supper Man
        type: string
    type: object
  dto.OrderRequest:
    properties:
      shipping_address:
        example: Viet Nam
        type: string
      total_amount:
        example: 100000
        type: integer
      user_phone:
        example: "10123456789"
        type: string
      username:
        example: Supper Man
        type: string
    required:
    - shipping_address
    - total_amount
    - user_phone
    - username
    type: object
  dto.UpdateStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/models.OrderStatus'
        example: delivered
    required:
    - status
    type: object
  models.OrderStatus:
    enum:
    - created
    - paid
    - packed
    - shipped
    - delivered
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - ORDER_STATUS_CREATED
    - ORDER_STATUS_PAID
    - ORDER_STATUS_PACKED
    - ORDER_STATUS_SHIPPED
    - ORDER_STATUS_DELIVERED
    - ORDER_STATUS_CANCELLED
    - ORDER_STATUS_REFUNDED
  response.PaginatedResponse:
    properties:
      data: {}
      message:
        example: Success
        type: string
      pagination:
        $ref: '#/definitions/response.Pagination'
      status:
        example: 200
        type: integer
    type: object
  response.Pagination:
    properties:
      current_page:
        example: 1
        type: integer
      limit_items:
        example: 10
        type: integer
      total_items:
        example: 100
        type: integer
    type: object
  response.ResponseStruct:
    properties:
      data: {}
      message:
        example: Success
        type: string
      status:
        example: 200
        type: integer
    type: object
host: localhost:5000
info:
  contact: {}
  description: HTTP API for order fulfillment tracking.
  title: Order Fulfillment Tracking API
  version: 1.0.0
paths:
  /api/v1/order-events/import:
    post:
      consumes:
      - application/json
      description: Process a batch of order status update events concurrently. Each
        event is validated and processed in its own DB transaction. The response always
        returns aggregated counts, even on partial failure.
      parameters:
      - description: List of events
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/dto.ImportOrderEventRequest'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.ImportOrderEventsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.ImportOrderEventsResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: Import batch order events
      tags:
      - Order Event
  /api/v1/orders:
    get:
      consumes:
      - application/json
      parameters:
      - description: Order Status
        in: query
        name: status
        type: string
      - description: Customer Name
        in: query
        name: customer_name
        type: string
      - description: Ordered Date
        in: query
        name: ordered_at
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.OrderReponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseStruct'
      security:
      - ApiKeyAuth: []
      summary: Get all orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: Create a new order
      parameters:
      - description: Order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseStruct'
      security:
      - ApiKeyAuth: []
      summary: Create order
      tags:
      - Order
  /api/v1/orders/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve detail of an order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderReponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseStruct'
      security:
      - ApiKeyAuth: []
      summary: Get order detail
      tags:
      - Order
  /api/v1/orders/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseStruct'
      security:
      - ApiKeyAuth: []
      summary: Update order status
      tags:
      - Order
  /api/v1/reports/daily:
    get:
      consumes:
      - application/json
      parameters:
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.DailyReportResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseStruct'
      security:
      - ApiKeyAuth: []
      summary: Daily order report
      tags:
      - Report
    post:
      consumes:
      - application/json
      parameters:
      - description: Date request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GetDailyReportRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/dto.DailyReportResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ResponseStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseStruct'
      security:
      - ApiKeyAuth: []
      summary: Create daily report manually
      tags:
      - Report
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-KEY
    type: apiKey
swagger: "2.0"
